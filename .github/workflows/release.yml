name: Release

# One-tap release: Actions → Release → Run workflow (works from the GitHub mobile app).
# Bumps the version, tags, publishes to npm and creates the GitHub Release with notes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none (publish the version already in package.json)

concurrency: release

permissions:
  contents: write  # push the release commit, tag and GitHub Release
  id-token: write  # npm --provenance signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token to expire) needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            patch|minor|major)
              # main is protected, so package.json there can lag behind npm.
              # Bump from whichever is newer: package.json or the latest published version.
              PUBLISHED=$(npm view @stronger-ecommerce/gadget-mcp version 2>/dev/null || echo 0.0.0)
              BASE=$(node -e '
                const [a, b] = process.argv.slice(1);
                const n = (v) => v.split("-")[0].split(".").map(Number);
                const [x, y] = [n(a), n(b)];
                for (let i = 0; i < 3; i++) if (x[i] !== y[i]) { console.log(x[i] > y[i] ? a : b); process.exit(); }
                console.log(a);
              ' "$(node -p 'require("./package.json").version')" "$PUBLISHED")
              npm version "$BASE" --no-git-tag-version --allow-same-version >/dev/null
              npm version "$BUMP" --no-git-tag-version
              ;;
            *) echo "Publishing the current version without a bump" ;;
          esac
          # Keep the Claude Code plugin's version in step with npm
          node -e '
            const fs = require("fs"), f = "plugin/.claude-plugin/plugin.json";
            const p = JSON.parse(fs.readFileSync(f));
            p.version = require("./package.json").version;
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
          '
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Make sure this version isn't on npm yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@stronger-ecommerce/gadget-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$VERSION is already published on npm. Pick patch/minor/major to release a new version."
            exit 1
          fi

      # main is protected (changes only via PR), so the version bump lives on the tag:
      # commit it off-branch and push just the tag. The npm package and GitHub Release
      # are built from this tagged commit.
      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git checkout --detach
            git commit -am "chore: release $VERSION"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists — reusing it"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      # Uses npm Trusted Publishing when it's configured for this workflow on npmjs.com;
      # otherwise falls back to the NPM_TOKEN secret.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --latest
          fi

      # The plugin runs the server from plugin/node_modules, which Claude Code installs from
      # plugin/package-lock.json. Lock it to the version just published (needs it on npm first).
      - name: Lock the plugin to this release
        id: plugin_lock
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd plugin
          npm pkg set "dependencies.@stronger-ecommerce/gadget-mcp=$VERSION"
          for i in 1 2 3 4 5 6; do
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund && break
            echo "npm hasn't served $VERSION yet; retrying in 20s"; sleep 20
          done
          node -e 'const l=require("./package-lock.json"); const v=l.packages["node_modules/@stronger-ecommerce/gadget-mcp"]?.version; if (v !== process.env.VERSION) { console.error("lockfile has " + v); process.exit(1); }'
          cd ..
          git add plugin/package.json plugin/package-lock.json
          git diff --cached --quiet || git commit -m "chore: lock the Claude plugin to $VERSION"

      # The marketplace (added as owner/repo@release) and the Anthropic directory listing
      # follow the release branch, so point it at this release. Not fatal: npm is already published.
      - name: Move the release branch
        if: steps.plugin_lock.outcome == 'success'
        continue-on-error: true
        run: git push --force origin HEAD:refs/heads/release

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## 🚀 Released v$VERSION"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@stronger-ecommerce/gadget-mcp/v/$VERSION"
            echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            echo ""
            echo "_The version bump is on the tag, not main (main is protected). The next release bumps from the newest published version automatically._"
          } >> "$GITHUB_STEP_SUMMARY"
